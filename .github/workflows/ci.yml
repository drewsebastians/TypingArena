name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & component tests
        run: npm test
      - name: Build (static export)
        run: npm run build
      - name: Static output gate (sitemap, robots, placeholders)
        run: node scripts/check-production-readiness.mjs
      - name: Production bundle must not contain runtime TTS or placeholder domains
        run: |
          if grep -rl "speechSynthesis" out/_next --include="*.js"; then
            echo "::error::speechSynthesis found in production bundles"; exit 1
          fi
          if grep -rlE "edge-tts|tts\.speech|googleapis\.com.*texttospeech|openai\.com|api\.anthropic|claude\.ai" out/_next --include="*.js" 2>/dev/null; then
            echo "::error::runtime AI/TTS endpoints found in production bundles"; exit 1
          fi
          if grep -rq "typingarena.example" out --include="*.html" --include="*.xml" --include="*.txt"; then
            echo "::error::placeholder domain leaked into production output"; exit 1
          fi
          if grep -rqE "example\.(com|org)|placeholder\.invalid" out/sitemap.xml out/robots.txt 2>/dev/null; then
            echo "::error::placeholder domain in sitemap/robots"; exit 1
          fi
          echo "clean"

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
